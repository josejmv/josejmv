<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Header del sitio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #E8EAF0; background: #0A0D14; padding: 20px 24px 8px; box-sizing: border-box">
<header style="max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 10px 12px 10px 22px; border: 1px solid rgba(255,255,255,0.08); border-radius: 999px; background: rgba(18,23,34,0.85)">
<a href="Main.dc.html" style="font-family: Sora, sans-serif; font-weight: 700; font-size: 20px; text-decoration: none; color: #E8EAF0">JMV<span style="color: #D4BF8E">.</span></a>
<nav aria-label="Principal" style="display: flex; gap: 24px; font-size: 14px; flex-wrap: wrap">
<a href="Main.dc.html" style="text-decoration: none; color: {{c.home}}">Inicio</a>
<a href="Experience.dc.html" style="text-decoration: none; color: {{c.experience}}">Experiencia</a>
<a href="Areas.dc.html" style="text-decoration: none; color: {{c.areas}}">Áreas</a>
<a href="Projects.dc.html" style="text-decoration: none; color: {{c.projects}}">Proyectos</a>
<a href="Contact.dc.html" style="text-decoration: none; color: {{c.contact}}">Contacto</a>
</nav>
<div style="display: flex; gap: 8px; align-items: center">
<button type="button" style="height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.1); background: #0E131D; color: #9AA3B2; font: 400 13px 'JetBrains Mono', monospace; cursor: pointer">Buscar…<span style="padding: 2px 8px; border-radius: 6px; background: #1B2232; color: #C9D0DB">Ctrl K</span></button>
<button type="button" aria-label="Cambiar idioma" style="height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: #E8EAF0; font: 600 12px 'JetBrains Mono', monospace; cursor: pointer"><strong>ES</strong>/EN</button>
<button type="button" aria-label="Cambiar tema claro u oscuro" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: #E8EAF0; cursor: pointer; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</div>
</header>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","experience","areas","projects","contact"],"default":"home"},"$preview":{"width":1440,"height":110}}'>
class Component extends DCLogic {
renderVals() {
const a = this.props.active ?? 'home';
const keys = ['home','experience','areas','projects','contact'];
const c = {};
keys.forEach(k => { c[k] = k === a ? '#E8EAF0' : '#9AA3B2'; });
return { c };
}
}
</script>
</body>
</html>
